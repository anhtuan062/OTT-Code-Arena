services:
  ott:
    environment:
      NODE_ENV: "production"
      EXECUTION_POLICY: "sandbox-required"
      ENABLE_SOURCE_REVISION_EXECUTION: "true"
      BOT_CPP_COMPILER_IMAGE: "${BOT_CPP_COMPILER_IMAGE:-docker.io/library/gcc@sha256:5e927c284bf55a7dc796262e311a0703344f62f41f5621eb56843111b1d37e15}"
      BOT_CPP_RUNTIME_IMAGE: "${BOT_CPP_RUNTIME_IMAGE:-docker.io/library/debian@sha256:7c7b2c966bc9ee8cedfe67e0e279108992c77681fa595db4a9d65c06ccc587}"
      BOT_PYTHON3_RUNTIME_IMAGE: "${BOT_PYTHON3_RUNTIME_IMAGE:-docker.io/library/python@sha256:2ed6491b93cd49272ee6de2b5a38440c3448360322c089fc23e370722d74179d}"
      BOT_CPP_COMPILE_TIMEOUT_MS: "${BOT_CPP_COMPILE_TIMEOUT_MS:-120000}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
