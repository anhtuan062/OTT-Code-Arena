name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: TypeScript, builds, tests and Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.5'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm exec tsc -- --noEmit

      - name: Build production application
        run: npm run build

      - name: Build public frontend
        run: npm run build:public

      - name: Run non-Docker automated tests
        run: >-
          npm exec vitest run -- --pool=threads --maxWorkers=1 --minWorkers=1
          --exclude "{tests/bot-executor/docker-integration.test.ts,tests/tournament/large-tournament-reliability.test.ts,tests/tournament/durability-recovery.test.ts,tests/server/startup.test.ts,tests/server/child-process-graceful-shutdown.test.ts}"

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml -f docker-compose.execution.yml config --quiet
