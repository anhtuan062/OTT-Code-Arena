name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Run unit and integration tests
        run: npx vitest run --pool=threads --maxWorkers=1 --minWorkers=1 --exclude tests/bot-executor/docker-integration.test.ts
        env:
          NODE_ENV: test

  docker-integration:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Verify Docker is available
        run: docker version

      - name: Pull bot execution base image
        run: docker pull node:20-alpine

      - name: Run Docker integration tests
        run: npx vitest run tests/bot-executor/docker-integration.test.ts
        env:
          NODE_ENV: test
        timeout-minutes: 10

      - name: Verify network isolation
        run: |
          docker run --rm --network none node:20-alpine sh -c \
            "if wget -q -T 2 http://example.com; then echo 'NETWORK_ACCESS_ALLOWED: isolation failed'; exit 1; else echo 'NETWORK_BLOCKED: network isolation confirmed'; fi"

      - name: Verify read-only filesystem
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=10m node:20-alpine sh -c \
            "if touch /test-write; then echo 'READONLY_FS_WRITABLE: restriction failed'; exit 1; else echo 'READONLY_FS: filesystem restriction confirmed'; fi"

      - name: Verify resource limits
        run: |
          container_id=$(docker run -d --memory=64m --pids-limit=16 node:20-alpine sleep 5)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          limits=$(docker inspect --format '{{.HostConfig.Memory}} {{.HostConfig.PidsLimit}}' "$container_id")
          test "$limits" = "67108864 16"
          echo "RESOURCE_LIMITS: $limits"

      - name: Verify security options
        run: |
          container_id=$(docker run -d --security-opt no-new-privileges:true --cap-drop ALL node:20-alpine sleep 5)
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          security_options=$(docker inspect --format '{{join .HostConfig.SecurityOpt " "}} {{join .HostConfig.CapDrop " "}}' "$container_id")
          test "$security_options" = "no-new-privileges:true ALL"
          echo "SECURITY_OPTS: $security_options"

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-test-logs
          path: |
            **/*.log
          retention-days: 7